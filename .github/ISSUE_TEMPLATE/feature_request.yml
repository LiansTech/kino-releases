name: Feature request
description: Suggest a feature or improvement for Kino.
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your idea. Give your request a clear title above.
        This request will be public.
  - type: checkboxes
    id: pre-submit-checks
    attributes:
      label: Pre-submit checks
      options:
        - label: I have searched [existing requests](https://github.com/LiansTech/kino-releases/issues?q=is%3Aissue%20label%3Aenhancement) for this feature.
          required: true
  - type: dropdown
    id: importance
    attributes:
      label: How important is this feature?
      options:
        - 'Essential: a missing capability blocks my workflow'
        - 'Useful: it would significantly improve my workflow'
        - 'Nice to have: a convenience or polish improvement'
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like Kino to do? Describe how you would use the feature.
    validations:
      required: true
  - type: textarea
    id: problem-to-solve
    attributes:
      label: Problem or workflow to improve
      description: What problem does this address, or what workflow would it improve? Include a concrete example if possible.
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      description: Which platform would benefit from this feature?
      options:
        - All platforms
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: kino-version
    attributes:
      label: Kino version
      description: Prefilled when opened from Kino. Otherwise, find it in the account menu or About panel.
      placeholder: e.g. 1.4.0
    validations:
      required: false
  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: Optional context, alternatives you have tried, or screenshots and mockups. You can drag and drop images here.
    validations:
      required: false
